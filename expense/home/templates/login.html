{% extends "base.html" %}
{% block title %}Sign In | Expense Tracker{% endblock %}

{% block start %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 0;
    }

    .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 32px;
        box-shadow: var(--card-shadow);
        backdrop-filter: blur(12px);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 28px;
    }

    .auth-header h2 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .auth-header p {
        color: var(--text-secondary);
        font-size: 14px;
        margin-top: 6px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
    }

    .form-group label {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
    }

    .form-control {
        width: 100%;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-sm);
        padding: 12px 16px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
    }

    .form-control:focus {
        border-color: var(--primary-accent);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .btn-submit {
        width: 100%;
        background: var(--primary-accent);
        color: #ffffff;
        border: none;
        padding: 14px;
        border-radius: var(--radius-sm);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: background-color 0.2s;
        margin-top: 8px;
    }

    .btn-submit:hover {
        background: var(--primary-accent-hover);
    }

    .auth-footer {
        text-align: center;
        margin-top: 24px;
        font-size: 14px;
        color: var(--text-secondary);
    }

    .auth-footer a {
        color: var(--primary-accent);
        text-decoration: none;
        font-weight: 600;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Sign in to access your personal expense dashboard</p>
        </div>

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" required placeholder="Enter your username" autofocus />
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" required placeholder="Enter your password" />
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'signup' %}">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
